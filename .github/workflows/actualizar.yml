name: Actualizar convocatorias
on:
  schedule:
    - cron: "17 6,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/import_bdns.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "radar360-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/convocatorias.json
          git diff --cached --quiet || (git commit -m "datos: actualización BDNS" && git pull --rebase -X theirs origin main && git push)
